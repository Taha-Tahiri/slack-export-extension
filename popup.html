<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slack Export</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="topbar-icon">S</div>
      <div class="topbar-text">
        <h1>Slack Export</h1>
        <span class="topbar-badge" id="messageCount">0 messages</span>
      </div>
    </div>

    <div id="status" class="status"></div>

    <div class="section">
      <div class="section-title">Date Range</div>
      <div class="option-list">
        <label class="option-row radio-row">
          <input type="radio" name="dateRange" value="all" id="rangeAll" checked>
          <span class="radio-dot"></span>
          <div class="option-info">
            <div class="option-name">All messages</div>
            <div class="option-desc">Export the entire conversation history</div>
          </div>
        </label>
        <label class="option-row radio-row">
          <input type="radio" name="dateRange" value="custom" id="rangeCustom">
          <span class="radio-dot"></span>
          <div class="option-info">
            <div class="option-name">Custom range</div>
            <div class="option-desc">Only export messages within a date range</div>
          </div>
        </label>
      </div>
      <div id="dateInputs" class="date-inputs" style="display: none;">
        <div class="date-field">
          <label for="dateFrom">From</label>
          <input type="date" id="dateFrom">
        </div>
        <div class="date-field">
          <label for="dateTo">To</label>
          <input type="date" id="dateTo">
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Include in export</div>
      <div class="option-list">
        <label class="option-row">
          <div class="option-info">
            <div class="option-name">JSON Data</div>
            <div class="option-desc">Raw structured data with all metadata</div>
          </div>
          <input type="checkbox" id="exportJson" checked>
          <span class="toggle"></span>
        </label>
        <label class="option-row">
          <div class="option-info">
            <div class="option-name">HTML Conversation</div>
            <div class="option-desc">Styled view with search, threads & reactions</div>
          </div>
          <input type="checkbox" id="exportHtml" checked>
          <span class="toggle"></span>
        </label>
        <label class="option-row">
          <div class="option-info">
            <div class="option-name">Media Files</div>
            <div class="option-desc">Download images & attachments locally</div>
          </div>
          <input type="checkbox" id="downloadMedia" checked>
          <span class="toggle"></span>
        </label>
      </div>
    </div>

    <div id="progress" class="progress-section" style="display: none;">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="progress-text" id="progressText">Initializing...</div>
    </div>

    <div class="actions">
      <button id="startBtn" class="btn btn-accent">Export</button>
      <button id="stopBtn" class="btn btn-stop" style="display: none;">Stop</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
